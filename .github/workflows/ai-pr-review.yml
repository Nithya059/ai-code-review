name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Generate diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.js' '*.ts' '*.py' > full_diff.txt
          head -n 200 full_diff.txt > diff.txt
          
      - name: Check diff size
        run: |
          wc -l diff.txt
          wc -c diff.txt

      - name: Run AI Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node reviewer.js diff.txt