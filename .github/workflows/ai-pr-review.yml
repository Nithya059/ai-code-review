name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Get changed files
        id: diff
        run: |
          git fetch origin main
          echo "CODE<<EOF" >> $GITHUB_ENV
          git diff origin/main >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run AI Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODE_TO_REVIEW: ${{ steps.diff.outputs.diff }}
        run: |
          node reviewer.js